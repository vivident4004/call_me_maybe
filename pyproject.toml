[project]
name = "chiamami-forse"
version = "1.0.0"
description = "Tool calling project @ 42"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "accelerate>=1.14.0",
    "pydantic>=2.13.4",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]

[tool.uv]
cache-dir = "./.uv_cache"

[tool.ruff.lint]
select = ["E", "F", "W", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
